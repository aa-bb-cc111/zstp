<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可视化图谱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #071421 0%, #0f2436 45%, #102f49 100%);
      overflow: hidden;
      color: #fff;
    }

    .header {
      position: absolute;
      top: 20px;
      left: 40px;
      z-index: 10;
    }

    .header h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #7be7ff, #6fffb0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .header p {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      max-width: 760px;
      line-height: 1.8;
    }

    svg {
      width: 100vw;
      height: 100vh;
    }

    .link {
      fill: none;
      stroke: rgba(120, 200, 255, 0.42);
      stroke-width: 2.6;
    }

    .node circle {
      stroke-width: 2;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 10px rgba(0,255,255,0.35));
    }

    .node:hover circle {
      transform: scale(1.08);
      filter: drop-shadow(0 0 18px rgba(0,255,255,0.8));
    }

    .node text {
      fill: #ffffff;
      font-weight: 600;
      pointer-events: none;
      text-anchor: middle;
    }

    .legend {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 168px;
      background: rgba(7, 20, 33, 0.75);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 12px 14px;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .legend h3 {
      margin-bottom: 8px;
      font-size: 13px;
      color: #7be7ff;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 7px;
      color: rgba(255,255,255,0.85);
      font-size: 11px;
    }

    .legend-color {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 7px;
    }

    .footer {
      position: absolute;
      bottom: 18px;
      left: 40px;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .zoom-controls {
      position: absolute;
      right: 30px;
      bottom: 30px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(7, 20, 33, 0.75);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 14px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(123,231,255,0.5);
      background: rgba(123,231,255,0.08);
      color: #7be7ff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: all 0.2s ease;
    }

    .zoom-btn:hover {
      background: rgba(123,231,255,0.25);
      transform: scale(1.08);
    }

    .zoom-reset {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .zoom-reset:hover {
      color: #7be7ff;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>可视化图谱</h1>
</div>

<div class="legend">
  <h3>知识层级</h3>
  <div class="legend-item"><div class="legend-color" style="background:#00e5ff"></div>核心战略层</div>
  <div class="legend-item"><div class="legend-color" style="background:#6fffb0"></div>绿色工厂评价层</div>
  <div class="legend-item"><div class="legend-color" style="background:#ffd166"></div>碳管理执行层</div>
  <div class="legend-item"><div class="legend-color" style="background:#ff7b7b"></div>指标与公式层</div>
</div>

<div class="footer">
  Knowledge Graph · Green Factory · Carbon Management · BYD Supplier Ecosystem
</div>

<svg id="graph" viewBox="0 0 2441 1632" preserveAspectRatio="xMidYMid meet"></svg>

<div class="zoom-controls">
  <div class="zoom-btn" id="zoomIn">+</div>
  <div class="zoom-btn" id="zoomOut" style="margin-top:10px;">&minus;</div>
  <div class="zoom-reset" id="zoomReset">复位</div>
</div>

<script>
const nodes = [
  {id:'绿色供应链体系', group:'core', r:44, x:864, y:722},

  {id:'2045全价值链碳中和', group:'strategy', r:26, x:430, y:350},
  {id:'绿色工厂评价', group:'factory', r:32, x:1298, y:380},
  {id:'供应商碳管理', group:'carbon', r:30, x:430, y:1078},

  {id:'能源低碳化', group:'factory', r:22, x:1112, y:210},
  {id:'资源高效化', group:'factory', r:22, x:1391, y:210},
  {id:'生产洁净化', group:'factory', r:22, x:1608, y:350},
  {id:'产品绿色化', group:'factory', r:22, x:1608, y:566},
  {id:'用地集约化', group:'factory', r:22, x:1391, y:706},

  {id:'碳数据透明化', group:'carbon', r:20, x:182, y:876},
  {id:'产品碳足迹', group:'carbon', r:20, x:120, y:1078},
  {id:'绿色采购体系', group:'carbon', r:20, x:275, y:1280},
  {id:'绿电使用', group:'carbon', r:18, x:554, y:1326},
  {id:'节能技改', group:'carbon', r:18, x:802, y:1326},
  {id:'循环经济', group:'carbon', r:18, x:1050, y:1280},

  {id:'单位产品碳排放量', group:'formula', r:18, x:1143, y:938},
  {id:'可再生能源利用率', group:'formula', r:18, x:1453, y:938},
  {id:'单位产品综合能耗', group:'formula', r:18, x:1716, y:908},

  {id:'绿色设计', group:'factory', r:18, x:1794, y:536},
  {id:'绿色物流', group:'carbon', r:18, x:275, y:1466},
  {id:'绿色包装', group:'carbon', r:18, x:554, y:1512},

  // —— 新增：JB/T 14451—2023《钢质锻件锻造生产能源消耗限额及评价方法》分支 ——
  {id:'锻造能耗限额标准', group:'formula', r:22, x:2042, y:799},
  {id:'加热工序限额', group:'formula', r:16, x:2259, y:660},
  {id:'锻造工序限额', group:'formula', r:16, x:2321, y:799},
  {id:'热处理工序限额', group:'formula', r:16, x:2259, y:954},
];

const links = [
  ['绿色供应链体系','2045全价值链碳中和'],
  ['绿色供应链体系','绿色工厂评价'],
  ['绿色供应链体系','供应商碳管理'],

  ['绿色工厂评价','能源低碳化'],
  ['绿色工厂评价','资源高效化'],
  ['绿色工厂评价','生产洁净化'],
  ['绿色工厂评价','产品绿色化'],
  ['绿色工厂评价','用地集约化'],

  ['供应商碳管理','碳数据透明化'],
  ['供应商碳管理','产品碳足迹'],
  ['供应商碳管理','绿色采购体系'],
  ['供应商碳管理','绿电使用'],
  ['供应商碳管理','节能技改'],
  ['供应商碳管理','循环经济'],
  ['供应商碳管理','绿色物流'],
  ['供应商碳管理','绿色包装'],

  ['能源低碳化','单位产品碳排放量'],
  ['能源低碳化','可再生能源利用率'],
  ['能源低碳化','单位产品综合能耗'],

  ['产品绿色化','绿色设计'],

  // —— 新增：单位产品综合能耗 / 单位产品碳排放量 与锻造行业能耗限额标准的关联 ——
  ['单位产品综合能耗','锻造能耗限额标准'],
  ['单位产品碳排放量','锻造能耗限额标准'],
  ['锻造能耗限额标准','加热工序限额'],
  ['锻造能耗限额标准','锻造工序限额'],
  ['锻造能耗限额标准','热处理工序限额'],
];

const svg = document.getElementById('graph');
const ns = 'http://www.w3.org/2000/svg';

// 整体图谱容器：向下平移，并适当左移以让图谱在可视区域内居中，避免与标题/图例文字粘连
const elementsGroup = document.createElementNS(ns,'g');
elementsGroup.setAttribute('transform','translate(0, 0) scale(1)');
svg.appendChild(elementsGroup);

const colors = {
  core:'#00e5ff',
  strategy:'#7be7ff',
  factory:'#6fffb0',
  carbon:'#ffd166',
  formula:'#ff7b7b'
};

// 将较长的节点文字拆分为多行（4个字以内单行，5~8字拆2行，超过8字拆3行）
function wrapLabel(str){
  const len = str.length;
  if(len <= 4) return [str];
  const numLines = len <= 8 ? 2 : 3;
  const perLine = Math.ceil(len / numLines);
  const lines = [];
  for(let i = 0; i < len; i += perLine){
    lines.push(str.slice(i, i + perLine));
  }
  return lines;
}

// 估算一行文字的像素宽度：中文按接近整字宽计算，英文/数字/符号按更窄的比例计算
function lineWidth(line, fontSize){
  let w = 0;
  for(const ch of line){
    w += /[\u4e00-\u9fa5]/.test(ch) ? fontSize * 0.98 : fontSize * 0.6;
  }
  return w;
}

// 根据换行后的文字尺寸，反推每个节点需要的最小半径；字号按节点原始重要程度分级，避免小节点被拉得过大
nodes.forEach(node => {
  if(node.group === 'core'){
    node.fontSize = 32;
  } else if(node.r >= 26){
    node.fontSize = 27;
  } else if(node.r >= 20){
    node.fontSize = 23;
  } else {
    node.fontSize = 21;
  }
  node.lines = wrapLabel(node.id);

  const lineH = node.fontSize * 1.2;
  const maxLineW = Math.max(...node.lines.map(l => lineWidth(l, node.fontSize)));
  const textH = node.lines.length * lineH;

  const neededR = Math.sqrt((maxLineW / 2) ** 2 + (textH / 2) ** 2) + 10;
  node.r = Math.max(node.r * 1.55, neededR);
});

// 三重对标 / 绿色工厂评价 —— 常显数据标签
const staticLabels = {
  // 三重对标核心指标
  '单位产品碳排放量': '行业先进值 0.45 tCO₂e/万元',
  '单位产品综合能耗': '行业先进值 0.141 tce/万元',

  // 绿色工厂评价分支：仅保留五大维度分数
  '能源低碳化': '30分',
  '资源高效化': '30分',
  '生产洁净化': '16分',
  '产品绿色化': '16分',
  '用地集约化': '8分'
};

function createStaticLabel(node, labelText){
  const g = document.createElementNS(ns,'g');
  g.setAttribute('class','static-label');
  g.style.pointerEvents = 'none';

  // 估算文字宽度以设置背景框大小
  const paddingX = 20;
  const boxWidth = Math.max(210, labelText.length * 25 + paddingX * 2);
  const boxHeight = 60;

  // 根据节点在画布中的位置，自动选择标签显示在上方或下方，避免超出画布
  const spaceAbove = node.y - node.r;
  const needAbove = boxHeight + 20 + 16;
  const placeBelow = spaceAbove < needAbove;

  const boxX = node.x - boxWidth / 2;
  const boxY = placeBelow ? (node.y + node.r + 20) : (node.y - node.r - boxHeight - 20);

  const rect = document.createElementNS(ns,'rect');
  rect.setAttribute('x', boxX);
  rect.setAttribute('y', boxY);
  rect.setAttribute('width', boxWidth);
  rect.setAttribute('height', boxHeight);
  rect.setAttribute('rx', 11);
  rect.setAttribute('fill', 'rgba(7,20,33,0.92)');
  rect.setAttribute('stroke', '#00e5ff');
  rect.setAttribute('stroke-width', '1.6');
  rect.style.filter = 'drop-shadow(0 0 6px rgba(0,229,255,0.5))';

  const text = document.createElementNS(ns,'text');
  text.setAttribute('x', node.x);
  text.setAttribute('y', boxY + boxHeight / 2 + 8);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('font-size', '25');
  text.setAttribute('fill', '#7be7ff');
  text.setAttribute('font-weight', '700');
  text.textContent = labelText;

  // 指向节点的小三角，方向随标签上/下方位置翻转
  const tri = document.createElementNS(ns,'polygon');
  const triCx = node.x;
  if(placeBelow){
    const triY = boxY;
    tri.setAttribute('points', `${triCx-13},${triY} ${triCx+13},${triY} ${triCx},${triY-16}`);
  } else {
    const triY = boxY + boxHeight;
    tri.setAttribute('points', `${triCx-13},${triY} ${triCx+13},${triY} ${triCx},${triY+16}`);
  }
  tri.setAttribute('fill', 'rgba(7,20,33,0.92)');
  tri.setAttribute('stroke', '#00e5ff');
  tri.setAttribute('stroke-width', '1.6');

  g.appendChild(rect);
  g.appendChild(tri);
  g.appendChild(text);
  elementsGroup.appendChild(g);
  return g;
}

function createLink(source, target){
  const s = nodes.find(n=>n.id===source);
  const t = nodes.find(n=>n.id===target);

  const path = document.createElementNS(ns,'path');
  path.setAttribute('class','link');

  const mx = (s.x+t.x)/2;
  const my = (s.y+t.y)/2 - 40;

  path.setAttribute('d', `M ${s.x} ${s.y} Q ${mx} ${my} ${t.x} ${t.y}`);
  elementsGroup.appendChild(path);
}

function createNode(node){
  const g = document.createElementNS(ns,'g');
  g.setAttribute('class','node');

  const circle = document.createElementNS(ns,'circle');
  circle.setAttribute('cx', node.x);
  circle.setAttribute('cy', node.y);
  circle.setAttribute('r', node.r);
  circle.setAttribute('fill', colors[node.group]);
  circle.setAttribute('fill-opacity', '0.18');
  circle.setAttribute('stroke', colors[node.group]);

  const text = document.createElementNS(ns,'text');
  text.setAttribute('x', node.x);
  text.setAttribute('font-size', node.fontSize);

  const lineH = node.fontSize * 1.2;
  const startY = node.y - ((node.lines.length - 1) * lineH) / 2 + node.fontSize * 0.35;

  node.lines.forEach((line, i) => {
    const tspan = document.createElementNS(ns,'tspan');
    tspan.setAttribute('x', node.x);
    tspan.setAttribute('y', startY + i * lineH);
    tspan.textContent = line;
    text.appendChild(tspan);
  });

  g.appendChild(circle);
  g.appendChild(text);

  const pulse = document.createElementNS(ns,'animate');
  pulse.setAttribute('attributeName','r');
  pulse.setAttribute('values',`${node.r};${node.r+4};${node.r}`);
  pulse.setAttribute('dur','4s');
  pulse.setAttribute('repeatCount','indefinite');
  circle.appendChild(pulse);

  elementsGroup.appendChild(g);
}

links.forEach(link=>createLink(link[0],link[1]));
nodes.forEach(node=>createNode(node));

// 统一在所有节点绘制完成后再叠加数据标签，确保标签始终显示在最上层
nodes.forEach(node=>{
  if(staticLabels[node.id]){
    createStaticLabel(node, staticLabels[node.id]);
  }
});

// ============== 缩放与拖拽控制 ==============
const baseTranslateX = 0, baseTranslateY = 0, baseScale = 1;
let currentScale = baseScale;
let panX = baseTranslateX, panY = baseTranslateY;

function applyTransform(){
  elementsGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${currentScale})`);
}

function setScale(newScale, cx, cy){
  newScale = Math.min(3, Math.max(0.5, newScale));
  // 以画布中心（或指定点）为基准缩放，保持视觉焦点不变
  const pt = svg.createSVGPoint();
  pt.x = cx; pt.y = cy;
  const ctm = elementsGroup.getScreenCTM ? null : null;

  const ratio = newScale / currentScale;
  panX = cx - (cx - panX) * ratio;
  panY = cy - (cy - panY) * ratio;
  currentScale = newScale;
  applyTransform();
}

const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');
const zoomResetBtn = document.getElementById('zoomReset');

const viewBoxCenter = { x: 1220, y: 816 };

zoomInBtn.addEventListener('click', () => setScale(currentScale * 1.15, viewBoxCenter.x, viewBoxCenter.y));
zoomOutBtn.addEventListener('click', () => setScale(currentScale / 1.15, viewBoxCenter.x, viewBoxCenter.y));

zoomResetBtn.addEventListener('click', () => {
  currentScale = baseScale;
  panX = baseTranslateX;
  panY = baseTranslateY;
  applyTransform();
});

// 鼠标滚轮缩放
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const svgX = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;
  const svgY = vb.y + ((e.clientY - rect.top) / rect.height) * vb.height;
  const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
  setScale(currentScale * factor, svgX, svgY);
}, { passive: false });

// 拖拽平移
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let panStart = { x: 0, y: 0 };

svg.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { x: panX, y: panY };
  svg.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (e) => {
  if(!isDragging) return;
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const dx = (e.clientX - dragStart.x) * (vb.width / rect.width);
  const dy = (e.clientY - dragStart.y) * (vb.height / rect.height);
  panX = panStart.x + dx;
  panY = panStart.y + dy;
  applyTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  svg.style.cursor = 'default';
});

applyTransform();
</script>

</body>
</html>
